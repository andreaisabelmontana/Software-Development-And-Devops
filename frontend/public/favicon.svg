<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- white circle background with green border -->
  <circle cx="32" cy="32" r="29" fill="#FFFFFF" stroke="#4CAF50" stroke-width="3.5"/>

  <!-- shopping cart, all in #4CAF50 -->
  <g fill="none" stroke="#4CAF50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- handle -->
    <path d="M14 18 L20 18 L24 42 L48 42"/>
    <!-- basket -->
    <path d="M22 24 L51 24 L47 38 L26 38 Z"/>
    <!-- vertical dividers in the basket -->
    <path d="M29 24 L29 38 M37 24 L37 38 M44 24 L44 38"/>
    <!-- horizontal divider -->
    <path d="M24 31 L48 31"/>
  </g>
  <!-- wheels -->
  <circle cx="29" cy="49" r="3.5" fill="#4CAF50"/>
  <circle cx="44" cy="49" r="3.5" fill="#4CAF50"/>
</svg>
