<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Shop · Redirecting…</title>
    <script>
      // GitHub Pages SPA shim: convert /repo/path → /repo/?p=/path so that
      // BrowserRouter can pick it back up in index.html. The companion
      // snippet in index.html restores the URL.
      (function () {
        var pathSegmentsToKeep = 1;     // /software-development-and-devops/
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
